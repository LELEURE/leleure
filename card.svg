<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="leleure neofetch card">
  <defs>
    <style>
      @keyframes rowin { from { opacity:0; transform:translateX(-14px);} to { opacity:1; transform:translateX(0);} }
      @keyframes artin { from { opacity:0; } to { opacity:1; } }
      @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      .chrome{ font:400 12px "Courier New",ui-monospace,monospace; fill:#8b949e; }
      .art  { font:700 14px "Courier New",ui-monospace,monospace; fill:#39d353; white-space:pre; opacity:0; animation:artin .8s ease .2s forwards; }
      .row  { font:400 15px "Courier New",ui-monospace,monospace; opacity:0; animation:rowin .5s cubic-bezier(.2,.7,.3,1) forwards; }
      .k    { fill:#39d353; font-weight:700; }
      .v    { fill:#adbac7; }
      .hdr  { fill:#7ee787; font-weight:700; }
      .dim  { fill:#30363d; }
      .motto{ font:italic 400 15px "Courier New",ui-monospace,monospace; fill:#7ee787; }
      #cur  { animation:blink 1s steps(1) infinite; }
      #h  { animation-delay:.25s; } #sep1{ animation-delay:.3s; }
      #r1 { animation-delay:.38s; } #r2{ animation-delay:.46s; } #r3{ animation-delay:.54s; }
      #r4 { animation-delay:.62s; } #r5{ animation-delay:.70s; } #r6{ animation-delay:.78s; }
      #r7 { animation-delay:.86s; } #r8{ animation-delay:.94s; } #r9{ animation-delay:1.02s; }
      #r10{ animation-delay:1.10s; } #r11{ animation-delay:1.18s; }
      #sep2{ animation-delay:1.26s; } #pal{ animation-delay:1.34s; } #mot{ animation-delay:1.44s; }
    </style>
  </defs>

  <rect x="1" y="1" width="858" height="468" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="858" height="34" rx="14" fill="#161b22"/>
  <rect x="1" y="20" width="858" height="15" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="430" y="22" text-anchor="middle" class="chrome">leleure@blackbox: ~/whoami</text>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363d" stroke-width="1"/>

  <!-- ASCII skull (left) -->
  <g transform="translate(40,70)" xml:space="preserve">
    <text class="art" y="0">        .-"""""-.</text>
    <text class="art" y="18">      .'         '.</text>
    <text class="art" y="36">     /   _     _   \</text>
    <text class="art" y="54">    |   (o)   (o)   |</text>
    <text class="art" y="72">    |       &lt;       |</text>
    <text class="art" y="90">    |   \  \_/  /   |</text>
    <text class="art" y="108">     \   '._.'    /</text>
    <text class="art" y="126">      '.         .'</text>
    <text class="art" y="144">        '-.___.-'</text>
    <text class="art" y="162">       | | | | | |</text>
    <text class="art" y="180">       '-'-'-'-'-'</text>
    <text class="art" y="210" fill="#6e7681">    [ grey hat // op ]</text>
    <text class="art" y="236" fill="#484f58">  ⬛ offense  ⬜ defense</text>
  </g>

  <!-- info rows (right) -->
  <g transform="translate(360,0)">
    <text id="h"   class="row hdr" y="72">leleure@github</text>
    <text id="sep1" class="row dim" y="90">───────────────────────────────</text>

    <text id="r1"  class="row" y="118"><tspan class="k">OS</tspan><tspan class="v" x="110">Epitech Linux (ex-EPITA · 2y)</tspan></text>
    <text id="r2"  class="row" y="144"><tspan class="k">Role</tspan><tspan class="v" x="110">AppSec · OSINT · RedM/FiveM Lua</tspan></text>
    <text id="r3"  class="row" y="170"><tspan class="k">Shell</tspan><tspan class="v" x="110">zsh // grey hat</tspan></text>
    <text id="r4"  class="row" y="196"><tspan class="k">Langs</tspan><tspan class="v" x="110">Lua · C# · TypeScript · HTML/CSS</tspan></text>
    <text id="r5"  class="row" y="222"><tspan class="k">Stack</tspan><tspan class="v" x="110">RedM · FiveM · Three.js</tspan></text>
    <text id="r6"  class="row" y="248"><tspan class="k">Certs</tspan><tspan class="v" x="110">CompTIA Pentest+ · THM Jr Pentester</tspan></text>
    <text id="r7"  class="row" y="274"><tspan class="k">Gear</tspan><tspan class="v" x="110">Flipper · Ducky · Pineapple · ESP32</tspan></text>
    <text id="r8"  class="row" y="300"><tspan class="k">Vectors</tspan><tspan class="v" x="110">RFID · NFC · Sub-GHz · IR · BadUSB · Wi-Fi</tspan></text>
    <text id="r9"  class="row" y="326"><tspan class="k">Ops</tspan><tspan class="v" x="110">BAOBAB AC · Reckless RP · Outbreak</tspan></text>
    <text id="r10" class="row" y="352"><tspan class="k">Speaks</tspan><tspan class="v" x="110">FR native · EN B2 · ES B1</tspan></text>
    <text id="r11" class="row" y="378"><tspan class="k">Status</tspan><tspan class="v" x="110">root@defense — "I build what I break"</tspan></text>

    <text id="sep2" class="row dim" y="404">───────────────────────────────</text>
    <g id="pal" class="row" transform="translate(0,422)">
      <rect x="0"   width="22" height="12" fill="#161b22"/>
      <rect x="26"  width="22" height="12" fill="#0e4429"/>
      <rect x="52"  width="22" height="12" fill="#006d32"/>
      <rect x="78"  width="22" height="12" fill="#26a641"/>
      <rect x="104" width="22" height="12" fill="#39d353"/>
      <rect x="130" width="22" height="12" fill="#69f0a0"/>
      <rect x="160" width="22" height="12" fill="#ff5f56"/>
      <rect x="186" width="22" height="12" fill="#ffbd2e"/>
    </g>
    <text id="mot" class="row motto" y="458">"I know how they break because I build the defenses."<tspan id="cur" fill="#39d353"> ▋</tspan></text>
  </g>
</svg>
