<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="leleure neofetch card">
  <defs>
    <style>
      @keyframes rowin{ from{opacity:0;transform:translateX(-14px);} to{opacity:1;transform:translateX(0);} }
      @keyframes artin{ from{opacity:0;} to{opacity:1;} }
      @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      @keyframes pulse{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
      @keyframes flick{ 0%,96%,100%{opacity:0;} 97%{opacity:.07;} 98%{opacity:.02;} 99%{opacity:.05;} }
      @keyframes warn { 0%,55%{opacity:1;} 56%,100%{opacity:.2;} }
      .chrome{ font:400 12px "Courier New",ui-monospace,monospace; fill:#8b949e; }
      .art { font:700 14px "Courier New",ui-monospace,monospace; fill:#b9c2c6; white-space:pre; opacity:0; animation:artin .8s ease .2s forwards; }
      .row { font:400 15px "Courier New",ui-monospace,monospace; opacity:0; animation:rowin .5s cubic-bezier(.2,.7,.3,1) forwards; }
      .k   { fill:#ff3b4e; font-weight:700; }
      .v   { fill:#c3ccd0; }
      .hdr { fill:#ff6b78; font-weight:700; }
      .dim { fill:#3d1114; }
      .danger{ fill:#ff2d55; font-weight:700; }
      .eye { fill:#ff0a1e; animation:pulse 1.2s ease-in-out infinite; }
      .motto{ font:italic 400 15px "Courier New",ui-monospace,monospace; fill:#9aa2aa; }
      #cur { animation:blink 1s steps(1) infinite; }
      #threat{ animation:warn 1.1s steps(1) infinite; }
      #h{animation-delay:.25s;} #sep1{animation-delay:.3s;}
      #r1{animation-delay:.38s;} #r2{animation-delay:.46s;} #r3{animation-delay:.54s;}
      #r4{animation-delay:.62s;} #r5{animation-delay:.70s;} #r6{animation-delay:.78s;}
      #r7{animation-delay:.86s;} #r8{animation-delay:.94s;} #r9{animation-delay:1.02s;}
      #r10{animation-delay:1.10s;} #r11{animation-delay:1.18s;}
      #sep2{animation-delay:1.26s;} #pal{animation-delay:1.34s;} #mot{animation-delay:1.44s;}
      @keyframes cdrip{ 0%{transform:scaleY(0);} 12%{transform:scaleY(0);} 60%{transform:scaleY(1);} 92%{transform:scaleY(1);opacity:1;} 100%{transform:scaleY(1);opacity:0;} }
      .blk { font:400 11px "Courier New",ui-monospace,monospace; fill:#cdd6da; white-space:pre; opacity:0; animation:artin .8s ease .2s forwards; }
      .ecore{ fill:#ffe3e3; animation:pulse 1.2s ease-in-out infinite; }
      .cdrip{ transform-origin:top; animation:cdrip 5s ease-in infinite; }
    </style>
    <filter id="eyeglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="34%" cy="42%" r="80%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a0010" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.3" fill="#000000" opacity="0.45"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="858" height="468" rx="14" fill="#05070a" stroke="#3d1114" stroke-width="1.5"/>
  <rect x="1" y="1" width="858" height="468" rx="14" fill="url(#vig)"/>
  <rect x="1" y="1" width="858" height="34" rx="14" fill="#120609"/>
  <rect x="1" y="20" width="858" height="15" fill="#120609"/>
  <circle cx="22" cy="18" r="5" fill="#ff1326"/>
  <text x="40" y="22" class="chrome" fill="#ff4d60">leleure@blackbox: ~/whoami — breach logged</text>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#3d1114" stroke-width="1"/>

  <!-- block skull with glowing bleeding eyes -->
  <g transform="translate(48,66)">
    <text class="blk" y="0.0">        ▓████████▓</text>
    <text class="blk" y="10.1">      ▓████████████▓</text>
    <text class="blk" y="20.2">     ▓██████████████▓</text>
    <text class="blk" y="30.4">    ▓████████████████▓</text>
    <text class="blk" y="40.5">    ▓████████████████▓</text>
    <text class="blk" y="50.6">    ▓████████████████▓</text>
    <text class="blk" y="60.7">    ▓████████████████▓</text>
    <text class="blk" y="70.8">    ▓██▓    ▓▓    ▓██▓</text>
    <text class="blk" y="81.0">    ▓██▓    ▓▓    ▓██▓</text>
    <text class="blk" y="91.1">    ▓██▓    ▓▓    ▓██▓</text>
    <text class="blk" y="101.2">    ▓████████████████▓</text>
    <text class="blk" y="111.3">    ▓████████████████▓</text>
    <text class="blk" y="121.4">    ▓██████▓  ▓██████▓</text>
    <text class="blk" y="131.6">     ▓█████▓  ▓█████▓</text>
    <text class="blk" y="141.7">      ▓████████████▓</text>
    <text class="blk" y="151.8">      ▓█ ██ ██ ██ █▓</text>
    <text class="blk" y="161.9">      ▓█ ██ ██ ██ █▓</text>
    <text class="blk" y="172.0">        ▓████████▓</text>
    <circle class="eye" cx="62.7" cy="77.7" r="8" fill="#ff0a1e" filter="url(#eyeglow)"/>
    <circle class="ecore" cx="62.7" cy="77.7" r="3" fill="#ffe3e3"/>
    <circle class="eye" cx="102.3" cy="77.7" r="8" fill="#ff0a1e" filter="url(#eyeglow)"/>
    <circle class="ecore" cx="102.3" cy="77.7" r="3" fill="#ffe3e3"/>
    <g class="cdrip" style="animation-delay:2.6s" transform="translate(62.7,84.7)"><rect x="-1" y="0" width="2" height="24" fill="#8a000e"/><circle cx="0" cy="24" r="2.2" fill="#ff1326"/></g>
    <g class="cdrip" style="animation-delay:3.9s" transform="translate(102.3,84.7)"><rect x="-1" y="0" width="2" height="24" fill="#8a000e"/><circle cx="0" cy="24" r="2.2" fill="#ff1326"/></g>
    <text id="threat" class="art" x="-14" y="208" fill="#ff2d55" opacity="1">  [ THREAT ACTOR DETECTED ]</text>
    <text class="art" x="-14" y="232" fill="#6e7681" opacity="1"> [#] offense   [~] defense</text>
  </g>

  <!-- info rows -->
  <g transform="translate(360,0)">
    <text id="h"   class="row hdr" y="72">leleure@github</text>
    <text id="sep1" class="row dim" y="90">───────────────────────────────</text>
    <text id="r1"  class="row" y="118"><tspan class="k">OS</tspan><tspan class="v" x="110">BlackBox Linux · rolling (anon)</tspan></text>
    <text id="r2"  class="row" y="144"><tspan class="k">Role</tspan><tspan class="v" x="110">AppSec · OSINT · RedM/FiveM Lua</tspan></text>
    <text id="r3"  class="row" y="170"><tspan class="k">Shell</tspan><tspan class="v" x="110">zsh // grey hat</tspan></text>
    <text id="r4"  class="row" y="196"><tspan class="k">Langs</tspan><tspan class="v" x="110">Lua · C# · TypeScript · HTML/CSS</tspan></text>
    <text id="r5"  class="row" y="222"><tspan class="k">Stack</tspan><tspan class="v" x="110">RedM · FiveM · Three.js</tspan></text>
    <text id="r6"  class="row" y="248"><tspan class="k">Certs</tspan><tspan class="v" x="110">CompTIA Pentest+ · THM Jr Pentester</tspan></text>
    <text id="r7"  class="row" y="274"><tspan class="k">Gear</tspan><tspan class="v" x="110">Flipper · Ducky · Pineapple · ESP32</tspan></text>
    <text id="r8"  class="row" y="300"><tspan class="k">Vectors</tspan><tspan class="v" x="110">RFID · NFC · Sub-GHz · IR · BadUSB · Wi-Fi</tspan></text>
    <text id="r9"  class="row" y="326"><tspan class="k">Ops</tspan><tspan class="v" x="110">BAOBAB AC · Reckless RP · Outbreak</tspan></text>
    <text id="r10" class="row" y="352"><tspan class="k">Speaks</tspan><tspan class="v" x="110">FR · EN · ES</tspan></text>
    <text id="r11" class="row" y="378"><tspan class="k">Status</tspan><tspan class="danger" x="110">root@defense — ACCESS: GRANTED</tspan></text>
    <text id="sep2" class="row dim" y="404">───────────────────────────────</text>
    <g transform="translate(0,414)"><g id="pal" class="row">
      <rect x="0"   width="22" height="12" fill="#161b22"/>
      <rect x="26"  width="22" height="12" fill="#0e4429"/>
      <rect x="52"  width="22" height="12" fill="#006d32"/>
      <rect x="78"  width="22" height="12" fill="#26a641"/>
      <rect x="104" width="22" height="12" fill="#39d353"/>
      <rect x="130" width="22" height="12" fill="#69f0a0"/>
      <rect x="160" width="22" height="12" fill="#ff2d55"/>
      <rect x="186" width="22" height="12" fill="#ffbd2e"/>
    </g></g>
    <text id="mot" class="row motto" y="458">"I know how they break because I build the defenses."<tspan id="cur" fill="#39d353"> ▋</tspan></text>
  </g>

  <!-- CRT overlays -->
  <rect x="1" y="35" width="858" height="434" fill="url(#scan)" pointer-events="none"/>
  <rect id="flick" x="1" y="1" width="858" height="468" rx="14" fill="#ff2d55" opacity="0" pointer-events="none"/>
</svg>
