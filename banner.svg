<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" role="img" aria-label="L3L3UR3 intrusion banner">
  <defs>
    <style>
      @keyframes wipe   { from{transform:translateX(0);} to{transform:translateX(620px);} }
      @keyframes blink  { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      @keyframes glitchR{ 0%,88%,100%{opacity:0;transform:translate(0,0);} 89%{opacity:.9;transform:translate(4px,-3px);} 92%{opacity:.7;transform:translate(-3px,2px);} 95%{opacity:.5;transform:translate(2px,1px);} }
      @keyframes glitchC{ 0%,86%,100%{opacity:0;transform:translate(0,0);} 87%{opacity:.9;transform:translate(-4px,3px);} 91%{opacity:.6;transform:translate(3px,-2px);} }
      @keyframes slice  { 0%,90%,100%{opacity:0;transform:translateX(0);} 91%{opacity:1;transform:translateX(-6px);} 93%{opacity:1;transform:translateX(8px);} 95%{opacity:0;} }
      @keyframes flick  { 0%,97%,100%{opacity:0;} 98%{opacity:.08;} 99%{opacity:.02;} }
      @keyframes warn   { 0%,60%{opacity:1;} 61%,100%{opacity:.15;} }
      @keyframes subin  { from{opacity:0;} to{opacity:1;} }
      @keyframes pulse  { 0%,100%{opacity:.55;} 50%{opacity:1;} }
      .title{ font:700 78px "Courier New",ui-monospace,monospace; letter-spacing:4px; }
      .sub  { font:400 17px "Courier New",ui-monospace,monospace; }
      .warn { font:700 15px "Courier New",ui-monospace,monospace; letter-spacing:2px; }
      .chrome{ font:400 12px "Courier New",ui-monospace,monospace; fill:#8b949e; }
      #wipe{ animation:wipe 1.3s cubic-bezier(.7,0,.3,1) .3s forwards; }
      #gr  { animation:glitchR 2.6s steps(1) 1.6s infinite; }
      #gc  { animation:glitchC 2.6s steps(1) 1.6s infinite; }
      #slice{ animation:slice 3.3s steps(1) 2s infinite; }
      #flick{ animation:flick 3s steps(1) infinite; }
      #sub { opacity:0; animation:subin .5s ease 1.5s forwards; }
      #warnline{ opacity:0; animation:subin .3s steps(1) 1.6s forwards, warn 1.1s steps(1) 1.9s infinite; }
      #cur { animation:blink 1s steps(1) infinite; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.3" y="0" fill="#000000" opacity="0.5"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="858" height="218" rx="14" fill="#07090c" stroke="#3d1114" stroke-width="1.5"/>

  <!-- window chrome -->
  <rect x="1" y="1" width="858" height="34" rx="14" fill="#120609"/>
  <rect x="1" y="20" width="858" height="15" fill="#120609"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="430" y="22" text-anchor="middle" class="chrome">root@blackbox — // intrusion in progress</text>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#3d1114" stroke-width="1"/>

  <!-- title + glitch -->
  <g transform="translate(40,128)">
    <text id="gc" class="title" fill="#2de2e6">L3L3UR3</text>
    <text id="gr" class="title" fill="#ff2d55">L3L3UR3</text>
    <text id="slice" class="title" fill="#ff2d55" opacity="0">L3L3UR3</text>
    <text class="title" fill="#39d353" filter="url(#glow)">L3L3UR3</text>
  </g>

  <!-- reveal wipe + printing cursor -->
  <g id="wipe">
    <rect x="40" y="56" width="620" height="92" fill="#07090c"/>
    <rect x="36" y="56" width="4" height="92" fill="#39d353"/>
  </g>

  <!-- red intrusion warning -->
  <text id="warnline" x="42" y="170" class="warn" fill="#ff2d55">⚠ UNAUTHORIZED ACCESS — INTRUSION LOGGED</text>
  <!-- subtitle -->
  <text id="sub" x="42" y="198" class="sub" fill="#7ee787">// offensive security · OSINT · grey hat<tspan id="cur" fill="#39d353"> ▋</tspan></text>

  <!-- CRT overlays -->
  <rect x="1" y="35" width="858" height="184" fill="url(#scan)" pointer-events="none"/>
  <rect id="flick" x="1" y="1" width="858" height="218" rx="14" fill="#39d353" opacity="0" pointer-events="none"/>
</svg>
